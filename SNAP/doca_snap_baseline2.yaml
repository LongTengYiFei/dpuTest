# Adapted from NVIDIA's doca_snap.yaml for the installed DOCA 2.7 image.
apiVersion: v1
kind: Pod
metadata:
  name: snap
spec:
  hostNetwork: true
  containers:
  - name: snap
    image: nvcr.io/nvidia/doca/doca_snap:4.4.0-doca2.7.0
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
      capabilities:
        add: ["IPC_LOCK", "SYS_RAWIO", "SYS_NICE"]
    volumeMounts:
    - mountPath: /dev/hugepages
      name: hugepages
    - mountPath: /dev/shm
      name: shm
    - mountPath: /dev/infiniband
      name: infiniband
    - mountPath: /dev/vfio
      name: vfio
    - mountPath: /etc/nvda_snap
      name: conf
    - mountPath: /var/log/snap-log
      name: snap-log
    resources:
      requests:
        memory: "2Gi"
        hugepages-2Mi: "4Gi"
        cpu: "8"
      limits:
        memory: "4Gi"
        hugepages-2Mi: "4Gi"
        cpu: "16"
    env:
    - name: SPDK_RPC_INIT_CONF
      value: "/etc/nvda_snap/spdk_rpc_init.conf"
    - name: SNAP_RPC_INIT_CONF
      value: "/etc/nvda_snap/snap_rpc_init.conf"
    # SNAP 4.4 defaults to DPA-backed NVMe emulation. Keep it explicit for
    # baseline 2 so the tested path cannot silently fall back to Arm cores.
    - name: NVME_EMU_PROVIDER
      value: "dpa"
  volumes:
  - name: hugepages
    emptyDir:
      medium: HugePages
  - name: shm
    hostPath:
      path: /dev/shm
  - name: infiniband
    hostPath:
      path: /dev/infiniband
  - name: vfio
    hostPath:
      path: /dev/vfio
  - name: conf
    hostPath:
      path: /etc/nvda_snap
  - name: snap-log
    hostPath:
      path: /var/log/snap-log

